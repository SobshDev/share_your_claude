name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # dtolnay/rust-toolchain publishes one branch per toolchain; the ref selects the version.
      # Keep this in step with the rust image tag in the Dockerfile so new clippy lints
      # arrive through a deliberate bump.
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check dashboard JavaScript syntax
        run: for f in static/*.js; do node --check "$f"; done
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Must match rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.94
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: shared-router:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for /readyz
        run: |
          set -euo pipefail
          # Throwaway values generated by the image itself; nothing here is a real secret.
          env_file="$RUNNER_TEMP/router.env"
          {
            echo "PUBLIC_ORIGIN=http://127.0.0.1:8080"
            echo "ENCRYPTION_KEY=$(docker run --rm shared-router:ci generate-key)"
            echo "ADMIN_PASSWORD_HASH=$(printf 'ci-smoke-password' | docker run --rm -i shared-router:ci hash-password)"
          } > "$env_file"
          docker run -d --name router --env-file "$env_file" -p 127.0.0.1:8080:8080 shared-router:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs router
          exit 1
      - name: Validate compose.yaml
        env:
          PUBLIC_ORIGIN: https://router.example.com
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ADMIN_PASSWORD_HASH: placeholder
        run: docker compose config -q
