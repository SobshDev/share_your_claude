name: opencodex smoke
on:
  workflow_dispatch:
  schedule:
    # Weekly, to catch drift in the pinned opencodex adapter or Bun.
    - cron: "41 6 * * 1"
permissions:
  contents: read
concurrency:
  group: opencodex-smoke-${{ github.ref }}
  cancel-in-progress: true
env:
  # Single source of truth for the opencodex version the router is tested against.
  OPENCODEX_VERSION: "2.49.0"
  BUN_VERSION: "1.3.14"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Keep in step with the toolchain in ci.yml.
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: oven-sh/setup-bun@v2 # TODO pin SHA (Dependabot)
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Unpack pinned opencodex
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/opencodex" --ignore-scripts --no-audit --no-fund \
            "@bitkyc08/opencodex@$OPENCODEX_VERSION"
          echo "OPENCODEX_SOURCE=$RUNNER_TEMP/opencodex/node_modules/@bitkyc08/opencodex" >> "$GITHUB_ENV"
      - name: Run the adapter smoke test
        run: cargo test --locked opencodex_adapter_smoke -- --ignored
