[package]
name = "shared-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A private Claude gateway with per-key model access and usage accounting"
repository = "https://github.com/SobshDev/shared_router"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
askama = "0.16"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["process"] }
tower = { version = "0.5", features = ["util"] }

# Editors and plain `cargo clippy` runs see the same policy as CI, which adds -D warnings.
[lints.rust]
unsafe_code = "forbid"

# A curated subset of clippy::pedantic. The whole group is mostly noise for a binary crate.
[lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
doc_markdown = "warn"
format_collect = "warn"
format_push_string = "warn"
ignored_unit_patterns = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
nonminimal_bool = "warn"
redundant_closure_for_method_calls = "warn"
single_match_else = "warn"

[profile.release]
lto = "thin"
strip = true
