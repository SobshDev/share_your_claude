services:
  router:
    build: .
    image: shared-router:local
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your Dokploy HTTPS domain}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to a base64-encoded 32-byte key}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH to your Argon2id password hash}
      RUST_LOG: shared_router=info
    volumes:
      - router_data:/data
    expose:
      - '8080'
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
volumes:
  router_data:
