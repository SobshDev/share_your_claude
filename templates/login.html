<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Shared Router</title>
    <link rel="stylesheet" href="/assets/app.css?v={{ asset_version }}" />
    <script type="module" src="/assets/app.js?v={{ asset_version }}"></script>
  </head>
  <body class="login-page">
    <main class="login">
      <h1 class="wordmark wordmark-large"><span class="mark" aria-hidden="true"></span>Shared Router</h1>
      <form id="login-form" class="login-form">
        <label class="field" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus />
        <button class="button" type="submit">Sign in</button>
        <p id="login-error" class="login-error" role="alert"></p>
      </form>
    </main>
  </body>
</html>
